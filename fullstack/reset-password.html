<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha | GoTicket</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="pagina" style="min-height:100vh; display:flex; align-items:center;">
  <div class="auth-card" style="animation:none;">
    <div class="auth-marca">GoTicket</div>

    <form id="formNovaSenha" class="auth-form" novalidate>
      <h1 class="auth-titulo">Criar nova senha</h1>
      <p class="auth-sub">Escolha uma senha que você não usa em outros sites.</p>
      <div class="auth-erro" role="alert" hidden></div>
      <div class="auth-sucesso" role="status" hidden></div>

      <label for="newPassword">Nova senha</label>
      <input type="password" id="newPassword" autocomplete="new-password" placeholder="Nova senha" required>
      <ul class="requisitos-senha" id="requisitosSenha">
        <li data-regra="tamanho">Mínimo de 8 caracteres</li>
        <li data-regra="letra">Ao menos uma letra</li>
        <li data-regra="numero">Ao menos um número</li>
      </ul>

      <label for="confirmNewPassword">Confirmar nova senha</label>
      <input type="password" id="confirmNewPassword" autocomplete="new-password" placeholder="Repita a senha" required>

      <button type="submit" class="auth-btn">Salvar nova senha</button>
      <p class="auth-rodape"><a class="auth-link" href="index.html">Voltar para o site</a></p>
    </form>
  </div>
</main>

<script>
  const form    = document.getElementById("formNovaSenha");
  const erro    = form.querySelector(".auth-erro");
  const sucesso = form.querySelector(".auth-sucesso");
  const botao   = form.querySelector(".auth-btn");

  // O token sai da barra de endereço para não ficar no histórico
  const token = new URLSearchParams(window.location.search).get("token");
  history.replaceState(null, "", window.location.pathname);

  const regras = (senha) => ({
    tamanho: senha.length >= 8,
    letra:   /[A-Za-z]/.test(senha),
    numero:  /\d/.test(senha)
  });

  document.getElementById("newPassword").addEventListener("input", (e) => {
    const r = regras(e.target.value);
    document.querySelectorAll("#requisitosSenha li").forEach(li => li.classList.toggle("ok", r[li.dataset.regra]));
  });

  function mostrar(caixa, texto) {
    erro.hidden = sucesso.hidden = true;
    caixa.textContent = texto;
    caixa.hidden = false;
  }

  if (!token) {
    mostrar(erro, "Link inválido. Solicite a recuperação de senha novamente.");
    botao.disabled = true;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const senha     = document.getElementById("newPassword").value;
    const confirmar = document.getElementById("confirmNewPassword").value;

    if (!Object.values(regras(senha)).every(Boolean)) return mostrar(erro, "A senha não atende aos requisitos.");
    if (senha !== confirmar) return mostrar(erro, "As senhas não conferem.");

    botao.disabled = true;
    botao.classList.add("carregando");

    try {
      const res  = await fetch("/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword: senha })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || "Erro ao redefinir senha.");

      mostrar(sucesso, data.message + " Redirecionando...");
      setTimeout(() => window.location.href = "index.html", 2500);
    } catch (err) {
      mostrar(erro, err.message);
      botao.disabled = false;
    } finally {
      botao.classList.remove("carregando");
    }
  });
</script>
</body>
</html>
